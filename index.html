<!doctype html>
<html lang="ru" data-service-loading>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Журнал встреч, решений и действий команды дизайн-системы. Поиск договорённостей, их оснований и связанных задач." />
  <title>Журнал решений</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23161e2e'/%3E%3Cpath d='M9 9h14M9 16h9M9 23h14' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem('decision-journal-theme'); } catch {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0a0a0b' : '#ffffff';
    })();
  </script>
  <style>
    html { background: #fff; color: #18191b; }
    html[data-theme="dark"] { background: #0a0a0b; color: #fafafa; }
    body { margin: 0; }
    #boot-fallback { display: grid; min-height: 100dvh; place-content: center; gap: 16px; text-align: center; padding: 24px; box-sizing: border-box; font: 14px/1.5 system-ui, sans-serif; }
    #boot-fallback button { justify-self: center; font: inherit; padding: 8px 16px; border: 1px solid currentColor; border-radius: 8px; color: inherit; background: transparent; cursor: pointer; }
    html[data-service-loading] #root { visibility: hidden; }
  </style>
  <link rel="stylesheet" href="/loading.css" />
  <link rel="preload" href="/app.css" as="style" />
  <link rel="modulepreload" href="/app.js" />
</head>
<body>
  <div id="boot-fallback" role="status"><span>Загружаем журнал…</span></div>
  <div id="root" inert aria-hidden="true"></div>
  <noscript><style>#boot-fallback { display: none; }</style><p style="padding:24px;font:16px/1.5 system-ui">Для работы журнала включите JavaScript в браузере.</p></noscript>
  <script defer src="/loading.js" onerror="document.getElementById('boot-fallback').innerHTML='<span>Не удалось загрузить журнал.</span><button onclick=&quot;location.reload()&quot;>Повторить</button>'"></script>
</body>
</html>
